info:
  name: create post
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/posts"
  body:
    type: json
    data: |-
      {
        "title": "Новый пост",
        "description": "Описание нового поста",
        "category": "Программирование",
        "imageUrl": "https://placehold.co/600x400?text=New"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
